<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; worker-src blob:; media-src 'self' blob: file:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Onda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div id="brand">Onda</div>
      <div id="top-actions">
        <button class="icon-btn" id="btn-open" title="Abrir archivo (Ctrl/⌘ + O)" aria-label="Abrir archivo">
          <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Personalizar" aria-label="Personalizar">
          <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        </button>
      </div>
    </header>

    <section id="stage">
      <div id="meta">
        <div id="track-title">Onda</div>
        <div id="track-info">Reproductor de audio sin compresión</div>
      </div>

      <div id="wave-wrap">
        <canvas id="wave"></canvas>
        <div id="hover-tip" hidden>0:00</div>
        <div id="wave-empty">
          <div class="empty-title">Suelta aquí un archivo de audio</div>
          <button class="chip-btn" id="btn-open-big">Abrir archivo</button>
        </div>
      </div>

      <div id="times"><span id="t-cur">0:00</span><span id="t-dur">0:00</span></div>

      <div id="controls">
        <button id="btn-norm" class="norm" role="switch" aria-checked="false" title="Normalizar a −14 LUFS (Spotify / YouTube). Solo cambia el volumen, no comprime.">
          <span class="norm-text">
            <span class="norm-top"><b id="lufs-val">—</b> <i>LUFS</i></span>
            <span class="norm-sub" id="norm-sub">Normalizar −14</span>
          </span>
          <span class="switch"><span class="knob"></span></span>
        </button>

        <div id="transport">
          <button class="icon-btn" id="btn-prev" title="Anterior" aria-label="Anterior">
            <svg viewBox="0 0 24 24"><path d="M6 5v14M19 6v12l-9-6z" class="fill"/></svg>
          </button>
          <button id="btn-play" title="Reproducir / pausar (Espacio)" aria-label="Reproducir">
            <svg id="ico-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" class="fill"/></svg>
            <svg id="ico-pause" viewBox="0 0 24 24" hidden><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" class="fill"/></svg>
          </button>
          <button class="icon-btn" id="btn-next" title="Siguiente" aria-label="Siguiente">
            <svg viewBox="0 0 24 24"><path d="M18 5v14M5 6v12l9-6z" class="fill"/></svg>
          </button>
        </div>

        <div id="right-ctl">
          <button class="icon-btn" id="btn-loop" title="Repetir (L)" aria-label="Repetir">
            <svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg>
          </button>
          <button class="icon-btn" id="btn-mute" title="Silenciar (M)" aria-label="Volumen">
            <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" class="fill"/><path id="vol-wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
          </button>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
        </div>
      </div>
    </section>

    <div id="settings" hidden>
      <div class="set-row h">
        <div class="set-label">Tema</div>
        <div class="seg" data-key="theme">
          <button data-value="dark">Oscuro</button><button data-value="midnight">Negro</button><button data-value="light">Claro</button>
        </div>
      </div>
      <div class="set-row">
        <div class="set-label">Color</div>
        <div class="swatches" id="swatches"></div>
      </div>
      <div class="set-row h">
        <div class="set-label">Forma</div>
        <div class="seg" data-key="style">
          <button data-value="bars">Barras</button><button data-value="smooth">Suave</button><button data-value="lines">Finas</button>
        </div>
      </div>
      <div class="set-row h">
        <div class="set-label">Altura</div>
        <div class="seg" data-key="scale">
          <button data-value="real">Real</button><button data-value="fit">Ajustada</button>
        </div>
      </div>
      <div class="set-row inline">
        <div class="set-label">Siempre encima</div>
        <button class="mini-switch" id="sw-top" role="switch" aria-checked="false"><span class="knob"></span></button>
      </div>
      <p class="hint">Sin compresor ni limitador: el audio suena tal cual. Normalizar solo ajusta el volumen general.</p>
    </div>

    <div id="toast" hidden></div>
    <div id="drop-veil"><span>Suelta para reproducir</span></div>
  </div>

  <script src="lufs.js"></script>
  <script src="app.js"></script>
</body>
</html>
